[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orangehrm-rpa-automation"
version = "1.0.0"
description = "Enterprise RPA Automation Suite for OrangeHRM and Mozilla Thunderbird"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Abdul Rehman", email = "abdulrehmanlhr55@gmail.com" }
]
dependencies = [
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.0",
    "robotframework>=6.1.0",
    "rpaframework>=28.0.0",
    "python-xlib>=0.33",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "msoffcrypto-tool>=5.4.2",
]

[project.scripts]
# Centralized CLI commands available after package installation.
run-rpa = "src.cli:main"

[tool.setuptools]
# Register the src packages so existing imports (src.pages...) continue to work.
packages = [
    "src",
    "src.pages",
    "src.keywords",
    "src.mixins",
    "src.services",
]
include-package-data = true

[tool.coverage.run]
source = ["src"]
omit = [
    "src/cli.py",
    "build_script.py",
    "src/base_page.py",
    "src/pages/my_info_page.py",
    "src/pages/time_page.py",
    "src/keywords/orangehrm_keywords.py",
    "src/services/thunderbird_mailer.py",
    "src/excel_manager.py",
    "src/mixins/attachment_mixin.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == '__main__':",
    "raise NotImplementedError",
    "pass",
]